name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, testes unitários e APKs
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar e testar
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :testfield:assembleDebug :app:lintDebug
      - name: Resumo dos testes unitários
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.get('tests'));f+=int(r.get('failures'));e+=int(r.get('errors'));s+=int(r.get('skipped'))
          print(f"Testes unitários: {t} executados, {f} falhas, {e} erros, {s} ignorados")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
            app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: KeyHistory-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

  emulator:
    name: Testes no emulador Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pré-compilar
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :testfield:assembleDebug
      - name: Emulador (API 30) + testes instrumentados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./scripts/ci-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-report
          path: build/ci-report

  publish:
    name: Publicar APK no repositório
    needs: [build, emulator]
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: KeyHistory-apk
          path: dl/apk
      - uses: actions/download-artifact@v4
        with:
          name: emulator-report
          path: dl/report
      - name: Commit do APK e capturas de tela
        run: |
          mkdir -p apk docs/screenshots
          cp dl/apk/release/app-release.apk apk/KeyHistory-1.0.0.apk
          cp dl/report/screenshots/*.png docs/screenshots/ 2>/dev/null || true
          sha256sum apk/KeyHistory-1.0.0.apk > apk/SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "ci: publicar APK de release e capturas de tela [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
